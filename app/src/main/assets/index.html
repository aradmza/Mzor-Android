<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mzor</title>
<link rel="stylesheet" href="https://mzaai.ir/assets/css/app.css">
<style>
html,body{height:100%;background:#1d2119;}
body.app-mode{display:block;}
.app{display:none;height:100%;}
body.logged .auth-page-wrap{display:none;}
body.logged .app{display:flex;}
</style>
</head>
<body class="auth-guest-body">
<div class="auth-page-wrap" id="authPage">
  <div class="auth-left">
    <div class="auth-left-top">
      <div class="auth-left-brand">Mzor</div>
      <h1 class="auth-left-headline">Mzor</h1>
      <p class="auth-left-desc">پلتفرم <strong>مزور</strong> برای چت فارسی، کد و ساخت تصویر. شروع رایگان.</p>
      <h2 class="auth-seo-h2">امکانات مزور</h2>
      <div class="auth-features-list">
        <div class="auth-feature-item"><span class="auth-feature-dot"></span>گفتگو با هوش مصنوعی</div>
        <div class="auth-feature-item"><span class="auth-feature-dot"></span>تولید تصویر با image 2</div>
        <div class="auth-feature-item"><span class="auth-feature-dot"></span>ساخت وب‌سایت</div>
        <div class="auth-feature-item"><span class="auth-feature-dot"></span>برنامه‌نویسی</div>
      </div>
    </div>
  </div>
  <div class="auth-right">
    <div class="auth-wrap">
      <div class="auth-logo">Mzor</div>
      <div class="auth-sub">خوش برگشتید</div>
      <input class="auth-input" id="loginUsername" placeholder="نام کاربری" autocomplete="username">
      <input class="auth-input" id="loginPassword" type="password" placeholder="رمز عبور" autocomplete="current-password">
      <button class="auth-btn" id="loginBtn">ورود</button>
      <div class="auth-error" id="authError"></div>
    </div>
  </div>
</div>
<div class="app">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-logo"><span>Mzor</span></div>
    <div class="sidebar-header"><button class="new-chat-btn" id="newChatBtn">+ <span style="color:var(--accent);">گفتگوی جدید</span></button></div>
    <div class="conv-list" id="convList"></div>
    <div class="sidebar-footer">
      <div class="plan-badge"><span class="plan-icon free">•</span><div><div class="plan-name" id="planName">رایگان</div><div style="font-size:11px;opacity:0.6;" id="planSub">0</div></div></div>
      <button class="new-chat-btn" id="buyBtn" style="margin-top:8px;">خرید پلن پاپ</button>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-left"><button class="menu-toggle" id="menuToggle">☰</button></div>
      <div class="topbar-right"><button class="topbar-icon-btn" id="logoutBtn"><span class="topbar-label" style="color:#ef5350;">خروج</span></button></div>
    </div>
    <div class="remaining-bar"><span id="planName2">رایگان</span><div class="remaining-progress"><div class="remaining-progress-bar" id="remProgressBar" style="width:0%"></div></div><span id="remCount">0</span>/<span id="remMax">0</span></div>
    <div class="messages" id="chatMessages"><div class="welcome"><h2>سلام! من مزور هستم</h2><p>یک گفتگوی جدید شروع کن</p></div></div>
    <div class="input-wrap"><div class="input-capsule"><textarea id="messageInput" placeholder="پیام..." rows="1"></textarea><button class="send-btn" id="sendButton" type="button"><svg viewBox="0 0 24 24"><path d="M5 12h14M5 12l6-6M5 12l6 6"/></svg></button></div></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>

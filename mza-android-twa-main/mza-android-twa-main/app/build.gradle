plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.mza.mzor'
    compileSdk 34

    defaultConfig {
        applicationId "ir.mza.mzor"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    // Release signing is picked up from environment variables that the
    // GitHub Actions workflow (.github/workflows/build.yml) injects from
    // repository secrets. If they are not present (e.g. a local debug
    // build), the release build simply falls back to the debug key so the
    // project still compiles.
    signingConfigs {
        release {
            def ksPath = System.getenv("MZA_KEYSTORE_PATH")
            if (ksPath != null) {
                storeFile file(ksPath)
                storePassword System.getenv("MZA_KEYSTORE_PASSWORD")
                keyAlias System.getenv("MZA_KEY_ALIAS")
                keyPassword System.getenv("MZA_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("MZA_KEYSTORE_PATH") != null) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        debug {
            // debug build works out of the box using Android's built-in debug key
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}

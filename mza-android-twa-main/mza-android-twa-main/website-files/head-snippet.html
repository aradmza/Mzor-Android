<!--
  این تکه را در فایل هدر مشترک PHP سایت (مثلاً header.php) داخل تگ <head> اضافه کن.
  فایل‌های manifest.webmanifest ، icon-192.png ، icon-512.png و sw.js
  باید کنار همین فایل، در ریشه‌ی سایت (public_html یا هر ریشه‌ای که با mzaai.ir/ باز می‌شود) آپلود شوند.
  فولدر .well-known هم باید دقیقا همانجا (ریشه‌ی سایت) قرار بگیرد.
-->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#191F16">
<link rel="apple-touch-icon" href="/icon-192.png">

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function (e) {
        console.warn('SW registration failed', e);
      });
    });
  }
</script>
